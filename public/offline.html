<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#06090f" />
  <title>لا يوجد اتصال</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#06090f;color:#e2e8f0;font-family:Tajawal,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
    main{max-width:420px}
    img{width:96px;height:96px;object-fit:contain;margin-bottom:16px;filter:drop-shadow(0 8px 24px rgba(16,185,129,.25))}
    h1{font-size:1.4rem;margin:0 0 8px}
    p{margin:0 0 20px;color:#94a3b8;line-height:1.7}
    button{background:#10b981;color:#052e22;border:0;border-radius:14px;padding:12px 28px;font-size:1rem;font-weight:700;cursor:pointer}
    button:active{transform:scale(.97)}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-inline-start:8px;animation:p 1.2s infinite}
    @keyframes p{50%{opacity:.3}}
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="" />
    <h1>لا يوجد اتصال بالإنترنت <span class="dot"></span></h1>
    <p>تعذّر الوصول إلى المنصة الآن. تحقّق من الشبكة وسنعيد المحاولة تلقائياً بمجرد عودة الاتصال.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </main>
  <script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
